# AndroidForge Toolchain Rules
# Single source of truth for toolchain compatibility mappings.

# Mapping: AGP version -> minimum compatible Gradle version
agp_to_gradle:
  "9.4": "9.6.0"
  "9.3": "9.5.0"
  "9.2": "9.4.1"
  "9.1": "9.3.1"
  "9.0": "9.1.0"
  "8.13": "8.13"
  "8.12": "8.13"
  "8.11": "8.13"
  "8.10": "8.11.1"
  "8.9": "8.11.1"
  "8.8": "8.10.2"
  "8.7": "8.9"
  "8.6": "8.7"
  "8.5": "8.7"
  "8.4": "8.6"
  "8.3": "8.4"
  "8.2": "8.2"
  "8.1": "8.0"
  "8.0": "8.0"
  "7.4": "7.5"
  "7.3": "7.4"
  "7.2": "7.3.3"
  "7.1": "7.2"
  "7.0": "7.0.2"
  "4.2": "6.7.1"
  "4.1": "6.5"
  "4.0": "6.1.1"
  "3.6": "5.6.4"
  "3.5": "5.4.1"
  "3.4": "5.1.1"
  "3.3": "4.10.1"
  "3.2": "4.6"
  "3.1": "4.4"
  "3.0": "4.1"
  "2.3": "3.3"

# Mapping: AGP version family -> JDK version
agp_to_jdk:
  "9.x": "17"
  "8.x": "17"
  "7.x": "11"
  "4.x": "11"
  "3.x": "8"
  "2.x": "8"

# Mapping: Gradle version family -> JDK version
gradle_to_jdk:
  "9.x": "17"
  "8.x": "17"
  "7.x": "11"
  "6.x": "8"
  "5.x": "8"
  "4.x": "8"

# Mapping: Kotlin version -> required JDK version
kotlin_to_jdk:
  "2.4.x": "17"
  "2.3.x": "17"
  "2.2.x": "17"
  "2.1.x": "17"
  "2.0.x": "11"
  "1.9.x": "11"
  "1.8.x": "11"
  "1.7.x": "11"
  "1.6.x": "8"
  "1.5.x": "8"
  "1.4.x": "8"
  "1.3.x": "8"

flutter:
  default_version: "3.24.0"
  channel: "stable"
  jdk: "17"

ndk:
  default_version: "26.1.10909125"
  legacy_versions:
    - "25.2.9519653"
    - "23.2.8568313"
    - "21.4.7075529"

android_sdk:
  platforms:
    - "platform-36"
    - "platform-35"
    - "platform-34"
    - "platform-33"
    - "platform-31"
    - "platform-30"
    - "platform-29"
    - "platform-28"
    - "platform-27"
    - "platform-26"
    - "platform-25"
    - "platform-24"
    - "platform-23"
  build_tools:
    - "36.0.0"
    - "35.0.0"
    - "34.0.0"
    - "33.0.2"
    - "32.0.0"
    - "31.0.0"
    - "30.0.3"
    - "29.0.3"
    - "28.0.3"
    - "27.0.3"
  extras:
    - "android;m2repository"
    - "google;m2repository"

legacy_fixes:
  - name: "patch_gradle_wrapper"
    description: "Regenerate gradle-wrapper.jar if missing or corrupt"
    applies_when: "wrapper_corrupt_or_missing"
  - name: "disable_gradle_daemon"
    description: "Disable Gradle daemon for very old Gradle versions (<4)"
    applies_when: "gradle_version < 4"
  - name: "use_system_gradle"
    description: "Use a compatible system Gradle when wrapper is incompatible"
    applies_when: "wrapper_incompatible_with_runner"
  - name: "migrate_https"
    description: "Rewrite HTTP Gradle distribution URLs to HTTPS"
    applies_when: "wrapper_url_http"
  - name: "inject_local_properties"
    description: "Create local.properties with Android SDK path"
    applies_when: "no_local_properties"
  - name: "add_google_maven"
    description: "Add Google and Maven Central repositories if missing"
    applies_when: "missing_repositories"

build_variants:
  - "assembleDebug"
  - "assembleRelease"
  - "bundleDebug"

dependency_fallbacks:
  - "https://maven.google.com"
  - "https://repo1.maven.org/maven2"
  - "https://plugins.gradle.org/m2"
  - "https://jitpack.io"